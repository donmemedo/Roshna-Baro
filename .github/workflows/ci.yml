name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: new advisories against unchanged code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -r app -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Tests (security regression + API + engine)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8036" }

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      # CLI instead of gitleaks-action: the action needs a paid licence for organisation repos
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # metrics off: this is a health-data project; ERROR and WARNING only so INFO noise cannot block merges
      - run: semgrep scan --metrics=off --severity ERROR --severity WARNING --config p/owasp-top-ten --config p/python --config p/typescript --error --quiet

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    strategy:
      matrix: { service: [backend, frontend] }
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build -t roshana-${{ matrix.service }}:ci ./${{ matrix.service }}
      - name: Scan image (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: roshana-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2   # avoids GHCR rate limits on shared runners

  smoke:
    # proves the hardened runtime (read-only rootfs, tmpfs, volume, non-root) actually boots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [containers]
    env: { SECRET_KEY: "ci-throwaway-0123456789abcdef0123456789abcdef" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS localhost:8036/api/ready && curl -fsS -o /dev/null localhost:3036/login
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
