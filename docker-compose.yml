# Hardened defaults: read-only root fs, all capabilities dropped, no privilege escalation,
# non-root users, resource limits, loopback-only ports. Put a TLS reverse proxy in front for public use.
name: roshana

x-hardening: &hardening
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  backend:
    <<: *hardening
    build: ./backend
    image: roshana-backend:1.1.0
    environment:
      APP_ENV: production
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - generate one with openssl rand -base64 48}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3036,http://127.0.0.1:3036}
      DEMO_MODE: ${DEMO_MODE:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Behind a reverse proxy set this to the proxy's address so rate limits see real client IPs.
      # Left at the default, every client behind the proxy would share one IP (and one limit).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - backend-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8036:8000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 256 }

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8036}
    image: roshana-frontend:1.1.0
    environment:
      # Set to 1 once the site is served over HTTPS (adds upgrade-insecure-requests to the CSP).
      CSP_UPGRADE_INSECURE: ${CSP_UPGRADE_INSECURE:-0}
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/.next/cache:rw,nosuid,nodev,size=128m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3036:3036"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 256 }

volumes:
  backend-data:
