services:
  backend:
    build: ./backend
    container_name: glow-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-really}
      DATABASE_URL: sqlite+aiosqlite:///./data/glow.db
      CORS_ORIGINS: http://localhost:3036,http://127.0.0.1:3036
    volumes:
      - backend-data:/app/data
    ports:
      - "8036:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8036}
    container_name: glow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3036:3036"

volumes:
  backend-data:
